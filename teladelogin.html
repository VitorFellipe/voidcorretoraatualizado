<body>
    <main class="Login">
    <h2>Login</h2>
    <p class="subtitulo">Segurança em primeiro lugar!</p>

    <form action="login.php" method="POST">
        <div class="campo">
            <label for="usuario">Nome de usuario:</label>
            <input type="text" name="usuario" id="usuario" placeholder="Digite seu nome de Usuario: " required>

            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" placeholder="Digite sua senha: " required> 
        </div>
        <button type="submit" class="logar">Acessar</button>
    </form>
    <p class="final">
        Não tem uma conta? <a href="criarconta.html">Criar Conta</a> 
    </p>
